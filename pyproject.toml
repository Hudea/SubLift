[project]
name = "sublift"
version = "0.1.0"
description = "硬字幕（烧录字幕）提取工具，从视频画面中自动识别字幕，生成可编辑的 SRT / ASS / VTT 文件。"
authors = [
    { name = "Hudea", email = "jinzhang0707@outlook.com" }
]
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
keywords = ["subtitle", "ocr", "vision", "ffmpeg", "hardcoded-subtitle"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "pillow>=10.0.0",
]

[project.optional-dependencies]
vision = [
    "pyobjc-framework-Vision>=10.0",
    "pyobjc-framework-Quartz>=10.0",
]

[project.scripts]
sublift = "sublift.cli:main"

[project.urls]
Homepage = "https://github.com/anomalyco/SubLift"
Repository = "https://github.com/anomalyco/SubLift"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

# --- 工具配置（feat-005 会细化，此处先占位最小可用） ---

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["Vision.*", "Quartz.*", "CoreGraphics.*", "Foundation.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
