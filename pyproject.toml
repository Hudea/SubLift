[project]
name = "sublift"
version = "0.1.0"
description = "SubLift 隔离的可选离线工具（benchmark / 诊断 / 冻结 Oracle）。产品入口是 Native CLI。"
authors = [
    { name = "Hudea", email = "jinzhang0707@outlook.com" }
]
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
keywords = ["subtitle", "ocr", "vision", "ffmpeg", "hardcoded-subtitle"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    # RapidOCR 也依赖 opencv-python。统一使用同一发行包，避免 paddle extra
    # 同时安装 headless/full 两份 cv2 并发生文件覆盖。
    "opencv-python>=4.8.0,<5.0.0",
]

[project.optional-dependencies]
vision = [
    "pyobjc-framework-Vision>=10.0",
    "pyobjc-framework-Quartz>=10.0",
]
paddle = [
    "rapidocr>=3.9.0,<4.0.0",
    "onnxruntime>=1.16",
]

[project.scripts]
sublift-benchmark = "sublift.benchmark.cli:main"

[project.urls]
Homepage = "https://github.com/anomalyco/SubLift"
Repository = "https://github.com/anomalyco/SubLift"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

# --- 工具配置（feat-005 会细化，此处先占位最小可用） ---

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# Harness validators are imported protocol assets with their own unittest
# contract; they are not part of SubLift's product Python source tree.
extend-exclude = [".agent"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade,
# B: bugbear, RUF: ruff 专有, SIM: simplify, ANN: 类型注解检查
select = ["E", "F", "W", "I", "UP", "B", "RUF", "SIM", "ANN"]
# RUF001/002/003: 中文全角标点误报；ANN401: 允许 Any
ignore = ["RUF001", "RUF002", "RUF003", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S101"]  # 测试允许无注解与 assert

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["Vision.*", "Quartz.*", "CoreGraphics.*", "Foundation.*", "objc.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["rapidocr.*", "rapidocr_onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# 默认质量基线只运行单元测试；集成测试（包括首次构造 PaddleOcrEngine
# 可能下载模型的用例）必须显式通过 ``pytest -m integration`` 运行。
addopts = "-ra --strict-markers --cov=sublift --cov-report=term-missing -m 'not integration'"
markers = [
    "integration: 需要外部资源（视频/ffmpeg/Vision）的集成测试",
]
